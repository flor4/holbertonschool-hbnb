<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - HBnB</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 2rem; }
        form { max-width: 400px; margin: auto; display: flex; flex-direction: column; gap: 1rem; }
        input { padding: 0.5rem; font-size: 1rem; }
        button { padding: 0.7rem; font-size: 1rem; cursor: pointer; }
        .error { color: red; display: none; }
        .success { color: green; display: none; }
    </style>
</head>
<body>
    <h1>Create an Account</h1>
    <form id="register-form">
        <input type="text" id="first_name" placeholder="First Name" required>
        <input type="text" id="last_name" placeholder="Last Name" required>
        <input type="email" id="email" placeholder="Email" required>
        <input type="password" id="password" placeholder="Password" required>
        <button type="submit">Register</button>
        <p class="error" id="error-message"></p>
        <p class="success" id="success-message"></p>
    </form>

    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const form = document.getElementById("register-form");
            const errorMessage = document.getElementById("error-message");
            const successMessage = document.getElementById("success-message");

            form.addEventListener("submit", async (event) => {
                event.preventDefault();

                // Clear previous messages
                errorMessage.style.display = "none";
                successMessage.style.display = "none";

                // Collect form data
                const data = {
                    first_name: document.getElementById("first_name").value.trim(),
                    last_name: document.getElementById("last_name").value.trim(),
                    email: document.getElementById("email").value.trim(),
                    password: document.getElementById("password").value.trim()
                };

                try {
                    const response = await fetch("http://127.0.0.1:5000/api/v1/users/", {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify(data)
                    });

                    const result = await response.json();

                    if (response.ok) {
                        successMessage.style.display = "block";
                        successMessage.textContent = "User created successfully! Redirecting to login...";
                        form.reset();

                        // Redirect to login page after 2 seconds
                        setTimeout(() => {
                            window.location.href = "login.html";
                        }, 2000);
                    } else {
                        errorMessage.style.display = "block";
                        errorMessage.textContent = result.message || result.error || "Registration failed.";
                    }

                } catch (err) {
                    errorMessage.style.display = "block";
                    errorMessage.textContent = "Network error. Please try again.";
                    console.error(err);
                }
            });
        });
    </script>
</body>
</html>
